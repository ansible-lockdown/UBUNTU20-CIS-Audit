---

{{ if .Vars.ubtu20cis_level_1 }}
  {{ if .Vars.ubtu20cis_rule_5_3_2_4 }}
file:
  pam_pwhistory_enabled_common_passwd:
    title: 5.3.2.4 | Ensure pam_pwhistory module is enabled
    path: /etc/pam.d/common-password
    exists: true
    contents:
    - '/^\s*password\s+(required|requisite)\s+pam_pwhistory.so/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.4
      CISv8:
      - 5.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: NA
  pam_pwhistory_enabled_common_passwd_config:
    title: 5.3.2.4 | Ensure pam_pwhistory module is enabled
    path: /usr/share/pam-configs/pwhistory
    exists: true
    contents:
    - 'Name: pwhistory password history checking'
    - 'Default: yes'
    - 'Priority: 1024'
    - 'Password-Type: Primary'
    - 'Password:'
    - '/\s+requisite\s+pam_pwhistory.so enforce_for_root try_first_pass remember=24 enforce_for_root use_authtok/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.4
      CISv8:
      - 5.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: NA
  {{ end }}
{{ end }}
