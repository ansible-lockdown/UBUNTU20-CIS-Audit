---

{{ if .Vars.ubtu20cis_level_1 }}
  {{ if .Vars.ubtu20cis_rule_5_3_2_2 }}
file:
  pam_faillock_enabled_common_act:
    title: 5.3.2.2 | Ensure pam_faillock module is enabled
    path: /etc/pam.d/common-account
    exists: true
    contents:
    - '/^\s*account\s+(requisite|required)\s+pam_faillock.so/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.2
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: NA
  pam_faillock_enabled_common_auth:
    title: 5.3.2.2 | Ensure pam_faillock module is enabled
    path: /etc/pam.d/common-auth
    exists: true
    contents:
    - '/^\s*auth\s+(requisite|required)\s+pam_faillock.so\s+preauth/'
    - '/^auth\s*\[default=die\]\s+pam_faillock.so\s+authfail/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.2
      CISv8:
      - 6.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: NA
  pam_faillock_config:
    title: 5.3.2.2 | Ensure pam_faillock module is enabled
    path: /usr/share/pam-configs/faillock
    exists: true
    contents:
    - 'Name: Enable pam_faillock to deny access'
    - 'Default: yes'
    - 'Priority: 0'
    - 'Auth-Type: Primary'
    - 'Auth:'
    - '/\s+[default=die]\s+pam_faillock.so authfail/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.2
      CISv8:
      - 6.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: NA
  pam_faillock_notify_config:
    title: 5.3.2.2 | Ensure pam_faillock module is enabled
    path: /usr/share/pam-configs/faillock_notify
    exists: true
    contents:
    - 'Name: Notify of failed login attempts and reset count upon success'
    - 'Default: yes'
    - 'Priority: 1024'
    - 'Auth-Type: Primary'
    - 'Auth:'
    - '/\s+requisite\s+pam_faillock.so preauth/'
    - 'Account-Type: Primary'
    - '/\s+required\s+pam_faillock.so/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.2
      CISv8:
      - 6.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: NA
  {{ end }}
{{ end }}
