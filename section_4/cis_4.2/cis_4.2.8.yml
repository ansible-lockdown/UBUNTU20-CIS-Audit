---

{{ if .Vars.ubtu20cis_level_1 }}
  {{ if .Vars.ubtu20cis_rule_4_2_8 }}
command:
  ufw_def_deny:
    title: 4.2.8 | Ensure ufw default deny firewall policy
    exec: 'ufw status verbose | grep Default:'
    exit-status: 0
    stdout:
    - '/^Default: deny \(incoming\), deny \(outgoing\), disabled \(routed\)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.2.8
      CISv8:
      - 4.4
      - 4.5
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - SC-7
  {{ end }}
{{ end }}
