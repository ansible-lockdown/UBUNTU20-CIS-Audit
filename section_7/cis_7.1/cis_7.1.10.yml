---

{{ if .Vars.ubtu20cis_level_1 }}
  {{ if .Vars.ubtu20cis_rule_7_1_10 }}
file:
  etc_security_opasswd_perms:
    title: 7.1.10 | Ensure access to /etc/security/opasswd is configured
    path: /etc/security/opasswd
    exists: true
    owner: root
    group: root
    mode:
      or:
      - "0600"
      - "0400"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.10
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  etc_security_opasswd_old_perms:
    title: 7.1.10 | Ensure access to /etc/security/opasswd is configured | opasswd.old
    path: /etc/security/opasswd.old
    owner: root
    group: root
    mode:
      or:
      - "0600"
      - "0400"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.10
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
