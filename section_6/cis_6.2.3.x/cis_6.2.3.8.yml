---

{{ if .Vars.ubtu20cis_level_1 }}
  {{ if .Vars.ubtu20cis_rule_6_2_3_8 }}
command:
  rsyslog_logrotate:
    title: 6.2.3.8 | Ensure rsyslog logrotate is configured | Manual
    exec: echo "Manual Check Required for rsyslog files being rotated"
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - 'OK'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.3.8
      CISv8:
      - 4.8
      - 8.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-8
  {{ end }}
{{ end }}
